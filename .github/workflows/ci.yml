name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в ту же ветку отменяет ещё идущую проверку
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck и сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc для фронта и для сервера
      - run: npm run typecheck

      # vite build (фронт) + tsc (сервер) → dist/
      - run: npm run build

      - name: Собранные файлы на месте
        run: |
          test -f dist/public/index.html
          test -f dist/server/index.js

  docker:
    name: Docker-образ собирается
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: kkmt:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
