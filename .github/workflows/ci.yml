name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в ту же ветку отменяет ещё идущую проверку
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Проверка и сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Бэкенд (Go)
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./server
      - run: go test ./server
      - run: go build -o dist/kkmt ./server

      # Фронтенд (React + Vite)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Собранные файлы на месте
        run: |
          test -f dist/public/index.html
          test -f dist/kkmt

  docker:
    name: Docker-образ собирается
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: kkmt:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
