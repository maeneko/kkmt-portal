name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в ту же ветку отменяет ещё идущую проверку
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Проверка и сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Бэкенд (Go)
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./server ./ocr
      - run: go test ./server
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/kkmt ./server
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/kkmt-ocr ./ocr

      # Фронтенд (React + Vite)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Собранные файлы на месте
        run: |
          test -f dist/public/index.html
          test -f dist/kkmt
          test -f dist/kkmt-ocr

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: dist
          path: dist
          retention-days: 3

  docker:
    name: Docker-образ собирается
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: kkmt:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Образ распознавания (Dockerfile.ocr): собирается из готового бинарника, как на сервере
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/kkmt-ocr ./ocr
      - run: docker build -f Dockerfile.ocr -t kkmt-ocr:ci .

  deploy:
    name: Выкатка на сервер
    runs-on: ubuntu-latest
    needs: [check, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: SSH-ключ
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          printf 'Host *\n  Port %s\n' "${{ secrets.SSH_PORT || 22 }}" > ~/.ssh/config

      # .env и uploads лежат на сервере и не трогаются
      - name: Копирование и перезапуск
        env:
          HOST: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          DIR: ${{ secrets.DEPLOY_PATH }}
        run: |
          chmod +x dist/kkmt dist/kkmt-ocr
          rsync -az --delete dist/ "$HOST:$DIR/dist/"
          rsync -az Dockerfile.runtime Dockerfile.runtime.dockerignore Dockerfile.ocr Dockerfile.ocr.dockerignore docker-compose.server.yml "$HOST:$DIR/"
          ssh "$HOST" "cd '$DIR' && docker compose -f docker-compose.server.yml up -d --build && docker image prune -f"
